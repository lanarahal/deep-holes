<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deep Holes — لونه‌های عمیق</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- صفحه اصلی نقشه -->
  <div id="map-screen" class="screen active">
    <header class="top-bar">
      <h1>Deep Holes</h1>
      <div class="wallet-area">
        <button id="connect-wallet-btn" class="btn">اتصال ولت (به‌زودی)</button>
        <span id="wallet-address" class="hidden"></span>
      </div>
    </header>

    <div id="map-container">
      <canvas id="map-canvas"></canvas>
    </div>

    <div class="hint">روی هر لونه کلیک کن تا واردش شی</div>
  </div>

  <!-- صفحه اتاق داخل لونه -->
  <div id="room-screen" class="screen">
    <header class="top-bar">
      <button id="back-to-map-btn" class="btn">← بازگشت به نقشه</button>
      <h2 id="room-title">لونه</h2>
    </header>

    <div id="room-info">
      <img id="room-image" src="" alt="تصویر لونه" />
      <div id="room-details">
        <p id="room-description"></p>
        <div id="room-links"></div>
      </div>
    </div>

    <div id="room-container">
      <canvas id="room-canvas"></canvas>
    </div>

    <div class="hint">با کلیدهای ← → حرکت کن</div>
  </div>

  <!-- داده‌های موقت و ماژول‌ها -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
